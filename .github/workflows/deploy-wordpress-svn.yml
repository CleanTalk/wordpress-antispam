name: Publish to WordPress SVN

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Final release version for SVN tag, for example 6.90"
        required: true
      dry_run:
        description: "Run in dry-run mode"
        required: true
        default: "true"
  release:
    types: [published]

permissions:
  contents: read

env:
  PLUGIN_SLUG: cleantalk-spam-protect
  RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}

jobs:
  svn-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Publish to SVN from master
        uses: ./.github/actions/deploy-wordpress-svn
        with:
          version: ${{ env.RELEASE_VERSION }}
          plugin_slug: ${{ env.PLUGIN_SLUG }}
          main_file: cleantalk.php
          ignore_file: .7zignore
          dry_run: ${{ github.event_name == 'release' && 'false' || inputs.dry_run }}
          svn_username: ${{ secrets.SVN_USERNAME }}
          svn_password: ${{ secrets.SVN_PASSWORD }}
          svn_url: ${{ secrets.SVN_URL }}
          matrix_server: ${{ secrets.MATRIX_SERVER }}
          matrix_room: ${{ secrets.MATRIX_GITHUB_WORKFLOW_FEED }}
          matrix_token: ${{ secrets.MATRIX_USER_TOKEN }}

  psc-task:
    needs: svn-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Create PSC task
        uses: ./.github/actions/create-psc-task
        with:
          version: ${{ env.RELEASE_VERSION }}
          plugin_slug: ${{ env.PLUGIN_SLUG }}
          create_task: ${{ (github.event_name == 'release' || inputs.dry_run == 'false') && 'true' || 'false' }}
          role_name: Pentesting on Duty
          doboard_username: ${{ secrets.DOBOARD_USERNAME }}
          doboard_password: ${{ secrets.DOBOARD_PASSWORD }}
          doboard_company_id: "1"
          doboard_project_id: "78"
          doboard_track_id: "1537"
